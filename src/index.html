<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OneSkool | School Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="/branding/oneskool-logo.png">
  <!-- Icon font preload — block FOUT of ligature text on notification/logout/etc. -->
  <link rel="preload" href="/assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Fonts are self-hosted (Inter via Fontsource; Material Symbols via assets). -->
  <style>
    @font-face {
      font-family: 'Material Symbols Rounded Variable';
      font-style: normal;
      font-display: block;
      font-weight: 100 700;
      src: url('/assets/fonts/material-symbols-rounded.woff2') format('woff2-variations');
    }
    .material-icons-round {
      font-family: 'Material Symbols Rounded Variable', 'Material Symbols Rounded' !important;
      font-weight: normal; font-style: normal;
      font-size: 20px; line-height: 1;
      letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap;
      word-wrap: normal; direction: ltr; flex-shrink: 0;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      -webkit-font-smoothing: antialiased;
    }
    .css-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #e2e8f0; border-top-color: #4f6ef7;
      animation: css-spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes css-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
