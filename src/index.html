<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OneSkool | School Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="/branding/oneskool-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <style>
    .material-icons-round {
      font-family: 'Material Symbols Rounded';
      font-weight: normal; font-style: normal;
      font-size: 20px; line-height: 1;
      letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap;
      word-wrap: normal; direction: ltr;
      /* Clip ligature names so slow/blocked Google Fonts never spill as text */
      width: 1em; height: 1em; overflow: hidden; flex-shrink: 0;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      -webkit-font-smoothing: antialiased;
    }
    .css-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #e2e8f0; border-top-color: #4f6ef7;
      animation: css-spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes css-spin { to { transform: rotate(360deg); } }
  </style>
</head>

  <app-root></app-root>
</body>
</html>
